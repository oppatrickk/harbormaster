name: Release

# Tagging is the publish action: push v1.1 and the built app shows up on the Releases page.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    # Not a pinned older runner: the tests use Swift Testing, which needs Xcode 16+. An image
    # whose default Xcode predates that fails at `import Testing`, not at anything useful.
    runs-on: macos-latest
    permissions:
      # Needed by `gh release create` to upload the artifact.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Run tests
        run: |
          xcodebuild test \
            -project Harbormaster.xcodeproj \
            -scheme Harbormaster \
            -destination 'platform=macOS'

      - name: Build release zip
        run: ./Scripts/build-release.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every release leads with install steps. The quarantine flag is the first thing a
          # downloader hits, and "Harbormaster is damaged" reads like a corrupt download
          # rather than what it is — an unnotarized app. gh prepends this to the generated
          # changelog rather than replacing it.
          cat > release-notes.md <<'EOF'
          ## Install

          ### From the terminal — no Gatekeeper prompt

          `gh` and `curl` don't set the quarantine attribute that triggers the warning below,
          so this route just works:

          ```bash
          gh release download --repo oppatrickk/harbormaster --pattern '*.zip'
          ditto -x -k Harbormaster-*.zip /Applications/
          open /Applications/Harbormaster.app
          ```

          ### From the browser

          Download the `.zip` below, unzip it, and drag `Harbormaster.app` to `/Applications`.
          macOS will refuse to open it, reporting that the app **"is damaged"**. Either:

          - **System Settings** → Privacy & Security → scroll to Security. After you've tried
            to open the app once, an **Open Anyway** button appears there. (It only shows up
            after a blocked attempt.)
          - **Or in Terminal:**

            ```bash
            xattr -dr com.apple.quarantine /Applications/Harbormaster.app
            ```

          **Why does that happen?** These builds are ad-hoc signed but *not notarized* —
          notarizing requires a paid Apple Developer account. "Damaged" is just Gatekeeper's
          generic wording for "failed the check"; the file is byte-identical to what CI built.
          Building from source avoids it entirely, since locally built apps are never
          quarantined.

          Universal binary (Apple Silicon and Intel). Requires macOS 13 Ventura or later.
          `/Applications` is required for launch-at-login to work reliably.

          ---
          EOF

          # workflow_dispatch has no tag, so fall back to a dev build people can still grab.
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="dev-$(date +%Y%m%d-%H%M%S)"
            printf '\nUnreleased build from %s\n' "${GITHUB_SHA}" >> release-notes.md
            gh release create "$TAG" dist/*.zip \
              --title "Harbormaster $TAG" --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$TAG" dist/*.zip \
              --title "Harbormaster ${TAG#v}" --notes-file release-notes.md --generate-notes
          fi
